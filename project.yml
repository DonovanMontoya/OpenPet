name: OpenPet

options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"

configs:
  Debug: debug
  Release: release

targets:
  CompanionPet:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/CompanionPet
        excludes:
          - Resources/DefaultPets/**
      - path: Sources/CompanionPet/Resources/DefaultPets
        type: folder
    info:
      path: packaging/XcodeInfo.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: OpenPet
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: OpenPet
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAppleEventsUsageDescription: OpenPet uses Apple events to launch supported terminal-based agent tools.
        NSHighResolutionCapable: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.openpet.OpenPet
        PRODUCT_MODULE_NAME: CompanionPet
        PRODUCT_NAME: OpenPet

schemes:
  OpenPet:
    build:
      targets:
        CompanionPet: all
    run:
      config: Debug
      executable: CompanionPet
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
