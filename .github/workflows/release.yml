name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v"
        required: true
        default: "0.1.0"
      build_number:
        description: "Bundle build number"
        required: true
        default: "1"
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        required: true
        default: false
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Package app
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./scripts/package-macos-app.sh

      - name: Create release archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          ditto -c -k --keepParent dist/OpenPet.app "dist/release/OpenPet-${VERSION}-macOS.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: OpenPet-${{ inputs.version }}-macOS
          path: dist/release/OpenPet-${{ inputs.version }}-macOS.zip
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            release create "v${VERSION}"
            "dist/release/OpenPet-${VERSION}-macOS.zip"
            --target "$GITHUB_SHA"
            --title "OpenPet v${VERSION}"
            --notes "OpenPet v${VERSION} macOS release."
          )

          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
